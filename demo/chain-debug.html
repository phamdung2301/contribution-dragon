<!DOCTYPE html><html><body style="background:#111;margin:8px">
<script>
let f = '';
for (let i = 0; i < 20; i++) {
  const n = String(i).padStart(2, '0');
  f += '<div style="color:#8b949e;font:11px monospace">frame ' + n + '</div>' +
    '<img src="../debug/frame-' + n + '.svg" width="100%" style="border:1px solid #333;margin-bottom:4px" onerror="this.style.display=\'none\'">';
}
document.write(f);
</script>
</body></html>
